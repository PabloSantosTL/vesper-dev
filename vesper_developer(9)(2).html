<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Vesper Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Oxanium:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<color>';inherits:true;initial-value:#17132a}
@property --b{syntax:'<color>';inherits:true;initial-value:#2a1f46}
:root{--ui:'Oxanium',system-ui,sans-serif;--tx:'Oxanium',system-ui,sans-serif;--ink:#efe8dc;--mut:#a39cb4;--lamp:#f0b968;--rose:#d9788f;--pan:rgba(16,13,32,.62);--ln:rgba(239,232,220,.14)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:17px/1.6 var(--tx);color:var(--ink);background:linear-gradient(180deg,var(--a),var(--b)) fixed;transition:--a 2s,--b 2s;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:600 15px var(--ui);color:var(--ink);background:rgba(239,232,220,.08);border:1px solid var(--ln);border-radius:10px;padding:.6em 1em;cursor:pointer;text-align:left;transition:background .2s,transform .15s}
button:hover:not(:disabled){background:rgba(240,185,104,.2);border-color:var(--lamp)}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.p{background:var(--lamp);color:#1b1428;border-color:var(--lamp)}
.p:hover:not(:disabled){background:#ffd08a!important}
[hidden]{display:none!important}
main{max-width:940px;margin:0 auto;padding:20px}
.pan{background:var(--pan);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:16px;padding:18px 20px}
h1,h2,h3{font-family:var(--ui);margin:0}
.lbl{font:600 13px var(--ui);color:var(--mut);margin:0 0 8px}
/* início */
#home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:22px}
#home h1{font-size:clamp(64px,16vw,150px);font-weight:800;letter-spacing:.06em;line-height:.9;background:linear-gradient(180deg,var(--lamp),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px);letter-spacing:.3em}}
#drop{border:2px dashed var(--ln);border-radius:18px;padding:34px 20px;text-align:center;transition:.2s}
#drop.over{border-color:var(--lamp);background:rgba(240,185,104,.12)}
#drop p{margin:0 0 14px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#lib .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
#lib .it:first-of-type{border:0}
.err{white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,monospace;border-color:var(--rose);color:#ffd5de}
/* jogo */
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
header h2{font-size:20px}
#clk{font:600 15px var(--ui);color:var(--lamp);display:flex;gap:14px;align-items:baseline}
#clk b{font-size:30px;font-weight:800;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 250px;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
#room h3{font-size:30px;margin-bottom:6px}
#desc{margin:0 0 10px;font-size:19px}
#chars span{display:inline-block;margin:0 8px 0 0;padding:2px 10px;border-radius:99px;background:rgba(217,120,143,.2);font:600 13px var(--ui)}
#stage{margin-top:14px;border-color:var(--lamp)}
#log{max-height:42vh;overflow:auto}
.ln{margin:0 0 10px;animation:in .35s both}
.ln.n{font-style:italic;color:#dcd3c4}
.ln b{font:600 14px var(--ui);color:var(--lamp);margin-right:8px}
.ln.e{color:#ffb4c3;font:14px ui-monospace,monospace}
@keyframes in{from{opacity:0;filter:blur(4px);transform:translateY(8px)}}
#ctl{display:flex;flex-direction:column;gap:8px;margin-top:8px;align-items:flex-start}
#acts{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.bs{display:flex;flex-wrap:wrap;gap:8px}
.bs small{font-weight:400;color:var(--mut);margin-left:6px}
#inv .i{padding:8px 0;border-top:1px solid var(--ln);font-family:var(--ui);font-size:14px}
#inv .i:first-of-type{border:0}
#inv .i p{margin:2px 0 6px;color:var(--mut);font:italic 15px var(--tx)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--lamp);color:#1b1428;padding:10px 18px;border-radius:99px;font:600 14px var(--ui);transition:.4s;opacity:0;pointer-events:none}
#toast.on{opacity:1}
dialog{background:#1b1630;color:var(--ink);border:1px solid var(--ln);border-radius:16px;padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(5,3,14,.7)}
.sl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-family:var(--ui);font-size:14px}
#side{display:flex;flex-direction:column;gap:14px;align-self:start}
@media(max-width:760px){#side{display:contents}#hud{order:-1}}
/* variáveis (HUD) */
#hud{display:flex;flex-direction:column;gap:14px}
#hud .lbl{margin:0}
.hv{--c:var(--rose);display:flex;flex-direction:column;gap:6px;font-family:var(--ui)}
.hh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.hl{color:var(--mut);font-weight:600}
.hn{display:inline-block;font-variant-numeric:tabular-nums;font-weight:600}
.s-number .hh{flex-direction:column;align-items:flex-start;gap:0}
.s-number .hn{font-size:30px;font-weight:800;color:var(--lamp);line-height:1.15}
.s-text .hn{font:italic 17px var(--tx)}
.bar{height:10px;border-radius:99px;background:rgba(239,232,220,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--c);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.hv.warn .bar{animation:pulse 1.2s ease-in-out infinite}
.pips{display:flex;gap:4px;flex-wrap:wrap;font-size:19px;line-height:1}
.pips span{color:rgba(239,232,220,.2);transition:color .3s}
.pips span.on{color:var(--c)}
.s-flag .hn{padding:1px 10px;border-radius:99px;border:1px solid var(--ln);font-size:13px}
.s-flag.on .hn{background:var(--c);color:#1b1428;border-color:var(--c)}
.hv.up .hn{animation:fup .9s}.hv.dn .hn{animation:fdn .9s}
@keyframes fup{30%{color:#8fd6a0;transform:scale(1.12)}}
@keyframes fdn{30%{color:#ff8a9b;transform:scale(.94)}}
@keyframes pulse{50%{opacity:.5}}
@keyframes blink{50%{opacity:0}}
/* console: escrita */
.wr>span::after{content:'▍';color:var(--lamp);margin-left:2px;animation:blink 1s steps(2) infinite}
.skip{font:13px var(--ui);color:var(--mut)}
#ctl>*,#acts>*{animation:in .5s both}
/* criação */
#create{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
#create h2{font-size:clamp(30px,6vw,48px);margin-bottom:6px}
#cdesc{font-size:19px;margin:0 0 20px}
.fld{margin:0 0 22px}
.fld label,.fld legend{font:600 15px var(--ui);display:block;margin:0 0 6px;padding:0}
.fld fieldset{border:0;padding:0;margin:0;min-width:0}
.fld .hint{display:block;color:var(--mut);font:italic 15px var(--tx);margin:-2px 0 8px}
.fld input[type=text]{width:100%;font:19px var(--tx);color:var(--ink);background:rgba(239,232,220,.07);border:1px solid var(--ln);border-radius:10px;padding:.55em .8em}
.fld input[type=text]:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-color:var(--lamp)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.fld .opt{position:relative;display:flex;margin:0;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:rgba(239,232,220,.06);cursor:pointer;transition:background .2s,border-color .2s}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt span{display:flex;flex-direction:column;gap:2px;font:600 15px var(--ui)}
.opt small{font:italic 15px/1.35 var(--tx);color:var(--mut);font-weight:400}
.opt:hover{background:rgba(240,185,104,.12)}
.opt:has(input:checked){border-color:var(--lamp);background:rgba(240,185,104,.2)}
.opt:has(input:checked) b::before{content:'✓ ';color:var(--lamp)}
.opt:has(input:focus-visible){outline:2px solid var(--lamp);outline-offset:2px}
.rng{display:flex;gap:14px;align-items:center}
.rng input{flex:1;accent-color:var(--lamp)}
.rng output{font:800 24px var(--ui);color:var(--lamp);min-width:3ch;text-align:right}
.ferr{color:#ffb4c3;font:600 14px var(--ui);margin:6px 0 0}
/* game over */
#over{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;overflow:auto;background:radial-gradient(ellipse at 50% 38%,rgba(34,10,26,.92),rgba(5,3,14,.98));animation:ofade 1.2s both}
@keyframes ofade{from{opacity:0}}
#over .ob{max-width:620px;text-align:center}
#otag{font:600 16px var(--ui);color:var(--mut);margin:0 0 10px;letter-spacing:.2em}
#otitle{font-size:clamp(40px,10vw,84px);font-weight:800;line-height:1;margin-bottom:26px;color:var(--rose);animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
#over.k-good #otitle{color:var(--lamp)}
#over.k-neutral #otitle{color:var(--ink)}
#otext{font-size:21px;margin:0 0 18px;min-height:4em}
#ocount{font:600 14px var(--ui);color:var(--mut);margin:0 0 22px}
#oacts>*{animation:in .5s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== CYBERPUNK OLED · terminal (luzes dinâmicas mantidas) ===== */
@property --ac{syntax:'<color>';inherits:true;initial-value:#b44cff}
@property --ac2{syntax:'<color>';inherits:true;initial-value:#ff2bd6}
:root{--ui:'Oxanium','JetBrains Mono',ui-monospace,monospace;--tx:'Oxanium','JetBrains Mono',ui-monospace,monospace;--hd:'Orbitron','Oxanium',ui-monospace,monospace;--ink:#d8f6ff;--mut:#6f8f9c;--pan:rgba(0,0,0,.78)}
body{font:15px/1.65 var(--tx);color:var(--ink);--lamp:var(--ac);--rose:var(--ac2);--ln:color-mix(in srgb,var(--ac) 30%,transparent);
 background:radial-gradient(ellipse at center,transparent 46%,rgba(0,0,0,.48) 100%),radial-gradient(120% 65% at 50% -8%,color-mix(in srgb,var(--a) 100%,transparent),transparent 70%),radial-gradient(90% 55% at 50% 112%,color-mix(in srgb,var(--b) 90%,transparent),transparent 65%),#000;background-attachment:fixed;
 transition:--a 2.5s,--b 2.5s,--ac 2.5s,--ac2 2.5s}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),linear-gradient(90deg,rgba(255,30,80,.018),transparent 34%,rgba(0,220,255,.018));box-shadow:inset 0 0 150px #000;animation:crt-flicker 8s steps(1,end) infinite}
@keyframes crt-flicker{0%,95%,100%{opacity:1}96%{opacity:.88}97%{opacity:.97}98%{opacity:.92}}
button{font:600 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:rgba(0,0,0,.6);border:1px solid var(--ln);border-radius:2px;padding:.7em 1em}
button:hover:not(:disabled){background:color-mix(in srgb,var(--lamp) 16%,#000);border-color:var(--lamp);box-shadow:0 0 14px -2px var(--lamp);color:#fff}
.p{background:var(--lamp);color:#000;border-color:var(--lamp);box-shadow:0 0 18px -4px var(--lamp)}
.p:hover:not(:disabled){background:#fff!important;color:#000!important}
.bs button::before{content:'> ';color:var(--lamp)}.bs small{text-transform:none;letter-spacing:0}
.pan{position:relative;border-radius:2px;border:1px solid var(--ln);background:var(--pan);box-shadow:0 0 0 1px #000,0 0 28px -14px var(--lamp),inset 0 0 40px -32px var(--lamp);backdrop-filter:blur(6px)}
.pan::before{content:'';position:absolute;inset:-1px;pointer-events:none;background:linear-gradient(var(--lamp),var(--lamp)) 0 0/14px 1px no-repeat,linear-gradient(var(--lamp),var(--lamp)) 0 0/1px 14px no-repeat,linear-gradient(var(--lamp),var(--lamp)) 100% 100%/14px 1px no-repeat,linear-gradient(var(--lamp),var(--lamp)) 100% 100%/1px 14px no-repeat}
.lbl{font:600 11px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}.lbl::before{content:'// ';color:var(--lamp)}
header h2{font:800 15px var(--hd);letter-spacing:.14em;text-transform:uppercase}
#clk b{font-family:var(--hd);text-shadow:0 0 14px var(--lamp)}
#room h3{font:800 22px var(--hd);letter-spacing:.08em;text-transform:uppercase;color:var(--lamp);text-shadow:0 0 14px color-mix(in srgb,var(--lamp) 60%,transparent)}
#desc{font-size:15.5px}.ln.n{color:#9fc4d0}.ln b{letter-spacing:.06em;text-transform:uppercase;font-size:12px}.ln.player{color:#b8f4df}.ln.player b{color:var(--rose);text-transform:none}
#chars span{border-radius:2px;background:color-mix(in srgb,var(--rose) 16%,#000);border:1px solid color-mix(in srgb,var(--rose) 55%,transparent);font-size:12px}
.bar{height:8px;border-radius:0}.bar i{border-radius:0;box-shadow:0 0 10px var(--c)}
.s-number .hn{font-family:var(--hd);text-shadow:0 0 12px var(--lamp)}.s-text .hn{font:italic 15px var(--tx)}
#inv .i p{font:italic 13px var(--tx)}
.fld input[type=text],.opt{border-radius:2px}.fld input[type=text]{background:#000;font:16px var(--tx)}
#create h2{font-family:var(--hd);text-transform:uppercase;letter-spacing:.06em}.opt small{font:italic 13px var(--tx)}
#drop{border:1px dashed var(--lamp);border-radius:2px}
dialog{background:#000;color:var(--ink);border:1px solid var(--lamp);border-radius:2px;box-shadow:0 0 40px -10px var(--lamp)}
dialog::backdrop{background:rgba(0,0,0,.84)}dialog h3{font:800 16px var(--hd);letter-spacing:.1em;text-transform:uppercase}
#toast{z-index:100;border-radius:2px;background:#000;color:var(--lamp);border:1px solid var(--lamp);box-shadow:0 0 20px -4px var(--lamp);text-transform:uppercase;letter-spacing:.06em}
#clrs{display:grid;gap:8px}#clrs button{display:flex;align-items:center;gap:10px}#clrs i{width:18px;height:18px;border:1px solid #fff4}
#over{background:radial-gradient(ellipse at 50% 40%,rgba(50,0,20,.85),#000 70%)}#otitle{font-family:var(--hd)}
#lib .it small{color:var(--mut)}
/* tela inicial */
#home{gap:18px}
#home::before{content:'';position:fixed;left:-20%;right:-20%;bottom:0;height:46vh;z-index:-1;pointer-events:none;background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/100% 46px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/60px 100%;transform:perspective(380px) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000,transparent 85%);mask-image:linear-gradient(to top,#000,transparent 85%);animation:grid 3s linear infinite}
@keyframes grid{to{background-position:0 46px,0 0}}
#home h1{position:relative;font:900 clamp(52px,15vw,140px)/1 var(--hd);letter-spacing:.14em;background:none;color:#fff;-webkit-text-fill-color:#fff;text-shadow:0 0 18px var(--lamp),0 0 70px color-mix(in srgb,var(--lamp) 55%,transparent);animation:bt 1.4s cubic-bezier(.2,.7,.2,1) both,flick 7s 2s infinite}
#home h1::before,#home h1::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen;text-shadow:none;-webkit-text-fill-color:currentColor}
#home h1::before{color:var(--rose);transform:translate(-3px,0);clip-path:inset(0 0 55% 0);animation:g1 3.2s infinite steps(1)}
#home h1::after{color:var(--lamp);transform:translate(3px,0);clip-path:inset(55% 0 0 0);animation:g2 2.7s infinite steps(1)}
@keyframes bt{from{opacity:0;filter:blur(10px);letter-spacing:.5em}}
@keyframes flick{0%,92%,97%,100%{opacity:1}93%{opacity:.5}94%{opacity:1}96%{opacity:.7}}
@keyframes g1{0%,90%,100%{clip-path:inset(0 0 55% 0);transform:translate(-3px,0)}92%{clip-path:inset(18% 0 45% 0);transform:translate(-9px,0)}95%{clip-path:inset(62% 0 8% 0);transform:translate(6px,0)}}
@keyframes g2{0%,86%,100%{clip-path:inset(55% 0 0 0);transform:translate(3px,0)}88%{clip-path:inset(30% 0 50% 0);transform:translate(8px,0)}91%{clip-path:inset(5% 0 70% 0);transform:translate(-6px,0)}}
.tag{font:600 12px var(--ui);letter-spacing:.35em;text-transform:uppercase;color:var(--lamp);margin:-6px 0 0}.tag::before{content:'▌';margin-right:.6em;animation:blink 1s steps(2) infinite}
.boot{margin:0;padding:0;list-style:none;font:12px/1.9 var(--ui);color:var(--mut)}.boot li{opacity:0;animation:bl .4s forwards}.boot b{color:var(--lamp);font-weight:600}
.boot li:nth-child(1){animation-delay:.6s}.boot li:nth-child(2){animation-delay:1s}
@keyframes bl{to{opacity:1}}

/* ===== INTERFACE RESPONSIVA · SCROLL NEON DINÂMICO ===== */
/* --ac e --ac2 são atualizadas pela função lights(): automático, Theme.set ou escolha manual. */
html{scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--ac) color-mix(in srgb,var(--ac) 11%,#05070b)}
body,*{scrollbar-width:thin;scrollbar-color:var(--ac) color-mix(in srgb,var(--ac) 11%,#05070b)}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:color-mix(in srgb,var(--ac) 10%,#03050a);border:1px solid color-mix(in srgb,var(--ac2) 24%,transparent)}
*::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--ac2),var(--ac));border:2px solid color-mix(in srgb,var(--ac) 12%,#05070b);border-radius:2px;box-shadow:0 0 10px color-mix(in srgb,var(--ac) 70%,transparent)}
*::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--ac),var(--ac2));box-shadow:0 0 14px var(--ac)}
#log{max-height:min(48vh,560px);overflow:auto;overscroll-behavior-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;padding-right:8px;scrollbar-color:var(--ac2) color-mix(in srgb,var(--ac2) 9%,#03050a)}
#log::-webkit-scrollbar{width:8px}
#log::-webkit-scrollbar-track{background:color-mix(in srgb,var(--ac2) 9%,#03050a)}
#log::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--ac2),var(--ac));border-color:color-mix(in srgb,var(--ac) 12%,#05070b)}
#game{max-width:1180px;width:100%;min-width:0}
.grid{grid-template-columns:minmax(0,1fr) 270px;align-items:start}
.grid>div,#side{min-width:0}
#side{gap:12px}
.fold{min-width:0}
.fold>summary{display:none}
.fold>section.pan{min-width:0}
.sidehead{display:none}
#bpanel{display:none}
#panelShade{display:none}
.mobile-actions{display:none}

@media(max-width:760px){
  html,body{min-height:100%;width:100%;overflow-x:hidden}
  body{font-size:15px;background-attachment:scroll}
  main{width:100%;max-width:100%;padding:14px 12px}
  #game{padding:calc(env(safe-area-inset-top) + 86px) 12px calc(env(safe-area-inset-bottom) + 24px)}
  #game header{position:fixed;top:0;left:0;right:0;z-index:115;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 8px;align-items:center;margin:0;padding:calc(env(safe-area-inset-top) + 9px) 12px 10px;border-bottom:1px solid var(--ln);background:rgba(0,0,0,.98);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #game header h2{min-width:0;overflow-wrap:anywhere;font-size:clamp(12px,3.6vw,15px);line-height:1.35}
  #clk{justify-content:flex-end;gap:7px;white-space:nowrap;font-size:10px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
  #clk{transform:translateX(0);opacity:1;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .22s ease;will-change:transform,opacity}
  body.panel-open #clk{transform:translateX(-58px);opacity:.18;pointer-events:none}
  #clk b{font-size:clamp(19px,6vw,25px)}
  .header-actions{display:none}
  .header-actions button{min-width:0;padding:.75em .35em;text-align:center;font-size:10px;letter-spacing:.03em;min-height:42px}
  #bcor,#bsave,#bexit{display:none}
  .grid{display:block;width:100%;min-width:0}
  .grid>div{display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
  #room{padding:16px 14px}
  #room h3{font-size:clamp(18px,5.5vw,23px);line-height:1.25;overflow-wrap:anywhere}
  #desc{font-size:15px;line-height:1.55}
  #chars span{margin:5px 5px 0 0}
  #stage{margin-top:0;padding:13px 12px}

/* Efeitos de texto acionados pelo autor via Narrator.say / Character.say. */
.fx-char{display:inline-block;white-space:pre}
.ln.fx-shake .fx-char{animation:fx-shake .24s steps(2,end) infinite;animation-delay:calc(var(--i)*13ms)}
.ln.fx-wave .fx-char{animation:fx-wave 1.15s ease-in-out infinite;animation-delay:calc(var(--i)*42ms)}
.ln.fx-rainbow .fx-char{animation:fx-rainbow 3s linear infinite;animation-delay:calc(var(--i)*-95ms)}
.ln.fx-glitch .fx-char{animation:fx-glitch 1.8s steps(1,end) infinite;animation-delay:calc(var(--i)*31ms)}
.ln.fx-neon .fx-char{animation:fx-neon 1.35s ease-in-out infinite alternate;animation-delay:calc(var(--i)*22ms)}
.ln.fx-pulse .fx-char{animation:fx-pulse 1.3s ease-in-out infinite;animation-delay:calc(var(--i)*35ms)}
@keyframes fx-shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-.7px,.5px)}50%{transform:translate(.7px,-.4px)}75%{transform:translate(-.4px,-.6px)}}
@keyframes fx-wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fx-rainbow{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
@keyframes fx-glitch{0%,88%,100%{transform:translate(0);text-shadow:none}90%{transform:translate(-1px,1px);text-shadow:2px 0 #ff2bd6,-2px 0 #00f0ff}92%{transform:translate(1px,-1px);text-shadow:-2px 0 #ff2bd6,2px 0 #00f0ff}94%{transform:translate(0);text-shadow:1px 0 #fff,-1px 0 #00f0ff}}
@keyframes fx-neon{from{text-shadow:0 0 2px currentColor,0 0 5px currentColor;opacity:.82}to{text-shadow:0 0 5px currentColor,0 0 14px currentColor,0 0 24px currentColor;opacity:1}}
@keyframes fx-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.58;transform:scale(.96)}}

<script id="lua" type="text/plain">
local R={room={},scene={},char={},event={},item={},sched={},ending={},proj={},world={},vars0={},ord={room={},scene={},char={},event={},item={},sched={},ending={}}}
local S,Q,cur,waiting,errs,EQ={},{},nil,nil,{},{}
local busy,adv,pend=false,false,0
local DAYS={"monday","tuesday","wednesday","thursday","friday","saturday","sunday"}
local PT={"segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado","domingo"}
local WI={} for i,d in ipairs(DAYS) do WI[d]=i-1 end
local TRIG={enter_room=1,leave_room=1,time=1,action_completed=1,item_gained=1,item_removed=1,state_changed=1,day_started=1,character_state_changed=1,custom=1}
local function copy(t) if type(t)~="table" then return t end local c={} for k,v in pairs(t) do c[k]=copy(v) end return c end
-- Evita que um loop dentro de um evento/cena bloqueie a página inteira.
-- O limite é renovado a cada pausa da corrotina, permitindo cenas longas e interativas.
local function resumeLimited(co,...)
 local hits,hooked=0,false
 if debug and type(debug.sethook)=="function" then
  hooked=pcall(debug.sethook,co,function()
   hits=hits+1
   if hits>=500 then error("Limite de execução excedido (500 mil instruções). Verifique loops sem pausa em eventos/cenas.",0) end
  end,"",1000)
 end
 local ok,r=coroutine.resume(co,...)
 if hooked then pcall(debug.sethook,co,nil) end
 return ok,r
end
local function callLimited(fn,...)
 local co=coroutine.create(fn)

 if ok and coroutine.status(co)~="dead" then return false,"Uma condição/descrição não pode pausar a execução." end
 return ok,r
end
local function J(v) local t=type(v)
 if t=="string" then return '"'..v:gsub('[%c"\\]',function(c) return string.format("\\u%04x",c:byte()) end)..'"'
 elseif t=="table" then local a={}
  if #v>0 or next(v)==nil then for i,x in ipairs(v) do a[i]=J(x) end return "["..table.concat(a,",").."]" end
  for k,x in pairs(v) do a[#a+1]=J(tostring(k))..":"..J(x) end return "{"..table.concat(a,",").."}"
 elseif t=="number" or t=="boolean" then return tostring(v) end return "null" end
local function ser(v) local t=type(v)
 if t=="string" then return string.format("%q",v) elseif t=="table" then local a={}
  for k,x in pairs(v) do a[#a+1]="["..ser(k).."]="..ser(x) end return "{"..table.concat(a,",").."}" end return tostring(v) end
local function hm(s) local h,m=tostring(s):match("^(%d+):(%d+)$") if not h then return nil end return h*60+m end
local function rnd() S.seed=(S.seed*1103515245+12345)%2147483648 return S.seed/2147483648 end
local function interp(s) if type(s)~="string" or not s:find("{",1,true) then return s end
 s=s:gsub("{player%.([%w_]+)}",function(k) local v=S.pshow and S.pshow[k] if v==nil and S.player then v=S.player[k] end
  if type(v)=="table" then v=table.concat(v,", ") end if v==nil then return "" end return tostring(v) end)

 return s end
local function test(f,c) if f==nil then return true end if type(f)~="function" then return f and true or false end
 local ok,r=callLimited(f,c or {}) if not ok then errs[#errs+1]=tostring(r) return false end return r and true or false end
local function calc() local d=S.t//1440 return S.day0+d,(S.wd0+d)%7,S.t%1440//60,S.t%60 end
local function reg(cat,id,def)
 if type(id)~="string" or id=="" then error("ID inválido em "..cat,3) end
 if R[cat][id] then error('Identificador duplicado em '..cat..': "'..id..'"',3) end
 if type(def)~="table" then error(cat..' "'..id..'": a definição deve ser uma tabela',3) end
 local ok,i=pcall(debug.getinfo,3,"l") def._line=ok and i and i.currentline or nil
 def.id=id R[cat][id]=def local o=R.ord[cat] o[#o+1]=id end
-- eventos
local cb,fire,exec
function cb(fn,ctx,eventId) local fr={co=coroutine.create(fn),eventId=eventId,eventContext=eventId and copy(ctx or {}) or nil}
 local ok,r=resumeLimited(fr.co,ctx)
 if not ok then errs[#errs+1]=tostring(r) elseif coroutine.status(fr.co)~="dead" then fr.pend=r Q[#Q+1]={fr} end end
local function match(ev,c)
 for _,f in ipairs{"room","key","item","action"} do if ev[f] and ev[f]~=c[f] then return false end end
 local t=ev.trigger
 if t=="enter_room" or t=="leave_room" then if (ev.character or "player")~=c.actor then return false end
 elseif ev.character and ev.character~=(c.character or c.actor) then return false end
 if t=="custom" and ev.event~=c.event then return false end
 return true end
function exec(ev,c)
 if ev.once and S.done[ev.id] then return end
 if not test(ev.conditions,c) then return end
 if ev.chance and rnd()*100>=ev.chance then return end
 if ev.once then S.done[ev.id]=true end
 if ev.execute then cb(ev.execute,c,ev.id) end
 if ev.game_over then local eid=ev.game_over cb(function() coroutine.yield({op="OVER",id=eid}) end) end end
function fire(trig,c) c=c or {} c.trigger=trig c.event=c.event or trig c.actor=c.actor or "player"
 EQ[#EQ+1]={trig,c} if busy then return end
 busy=true local n=0
 while #EQ>0 and n<500 do n=n+1 local e=table.remove(EQ,1)
  for _,ev in ipairs(R.evlist) do if ev.trigger==e[1] and match(ev,e[2]) then exec(ev,e[2]) end end end
 if #EQ>0 then errs[#errs+1]="Limite de eventos excedido (possível ciclo)." EQ={} end
 busy=false end
-- estado
local function setv(k,v) local o=S.vars[k] S.vars[k]=v if o~=v then fire("state_changed",{key=k,value=v,old=o}) end end
local function cset(id,k,v) local c=S.chars[id] local o=c.state[k] c.state[k]=v if o~=v then fire("character_state_changed",{character=id,key=k,value=v,old=o}) end end
local function moveto(id,room) local c=S.chars[id] local old=c.room if old==room then return end
 fire("leave_room",{actor=id,room=old,next_room=room}) c.room=room fire("enter_room",{actor=id,room=room,previous_room=old}) end
local function pmove(room) local old=S.room
 fire("leave_room",{actor="player",room=old,next_room=room}) S.room=room fire("enter_room",{actor="player",room=room,previous_room=old}) if R.room[room] and R.room[room].save then S.savereq=S.savereq or true end end
-- scheduler
local function occ(a,b) local out={} local d0,d1=a//1440,b//1440
 for d=d0,math.min(d1,d0+4000) do local base=d*1440 local day,wd=S.day0+d,(S.wd0+d)%7
  if base>a and base<=b then out[#out+1]={at=base,cls=0,o=0,day=day} end
  for _,it in ipairs(R.timed) do local at=base+it.m
   if at>a and at<=b and it.ok(day,wd) then out[#out+1]={at=at,cls=it.cls,o=it.o,it=it} end end end
 table.sort(out,function(x,y) if x.at~=y.at then return x.at<y.at end if x.cls~=y.cls then return x.cls<y.cls end return x.o<y.o end)
 return out end
local function proc(x) S.t=x.at
 if x.day then local _,wd=calc() fire("day_started",{day=x.day,weekday=DAYS[wd+1]}) return end
 local it=x.it
 if it.ev then local ev=it.ev
  if not ev.repeat_mode then if S.fired[ev.id] then return end S.fired[ev.id]=true end
  exec(ev,{trigger="time",event="time",actor="world"})
 elseif test(it.e.conditions,{character=it.ch}) then
  if it.e.room then moveto(it.ch,it.e.room) end
  if it.e.state then cset(it.ch,"activity",it.e.state) end end end
local function advance(n,why) n=math.floor(tonumber(n) or 0) if n<=0 then return end
 if adv then pend=pend+n return end
 adv=true
 local ok,e=pcall(function() local tgt=S.t+n
  while true do for _,x in ipairs(occ(S.t,tgt)) do proc(x) end S.t=tgt
   if pend>0 then tgt=tgt+pend pend=0 else break end end end)
 adv=false pend=0 if not ok then errs[#errs+1]=tostring(e) end end
-- cenas
local function mkframe(id) local s=R.scene[id]
 if not s then error('Cena inexistente: "'..tostring(id)..'"',3) end return {co=coroutine.create(s.fn),id=id} end
local function pump(val) local out={} local steps=0
 while true do
  steps=steps+1
  if steps>4000 then
   out[#out+1]={op="ERR",text="Limite de processamento de cenas excedido. Verifique cenas que iniciam a si mesmas em sequência."}
   Q={} cur=nil break
  end
  if not cur then cur=table.remove(Q,1) if not cur then break end end
  local fr=cur[#cur] local cmd
  if fr.pend then cmd=fr.pend fr.pend=nil
  else local ok,r=resumeLimited(fr.co,val) val=nil
   if not ok then out[#out+1]={op="ERR",text=tostring(r)} cur=nil
   elseif coroutine.status(fr.co)=="dead" then cmd={op="RET",value=r} else cmd=r end end
  if cur then local op=type(cmd)=="table" and cmd.op or nil
   if op=="SAY" or op=="CLEAR" then out[#out+1]=cmd
   elseif op=="OVER" then S.over=cmd.id S.pendover=nil cur=nil Q={} waiting=nil break
   elseif op=="WAIT" or op=="CHOICE" then out[#out+1]=cmd waiting=cmd return out
   elseif op=="DELAY" then advance(cmd.n,"scene")
   elseif op=="CALL" then local ok,f=pcall(mkframe,cmd.id) if ok then cur[#cur+1]=f else out[#out+1]={op="ERR",text=tostring(f)} cur=nil end
   elseif op=="JUMP" then local ok,f=pcall(mkframe,cmd.id) if ok then cur[#cur]=f else out[#out+1]={op="ERR",text=tostring(f)} cur=nil end
   elseif op=="RET" or op=="END" then cur[#cur]=nil if #cur==0 then cur=nil else val=cmd.value end
   else out[#out+1]={op="ERR",text="Comando de cena inválido (use as funções Narrator/Scene)."} cur=nil end end
 end
 if S.pendover then S.over=S.pendover S.pendover=nil end
 return out end
-- visão
local function view()
 local r=R.room[S.room] local ctx={room=S.room,actor="player"}
 local d=r.description if type(d)=="function" then local ok,v=callLimited(d,ctx) d=ok and v or ("[erro: "..tostring(v).."]") end
 local ex,ac,ch,inv={},{},{},{}
 for _,x in ipairs(r.exits or {}) do
  if not (x.hidden and not S.shown[r.id..":"..x.id]) and test(x.conditions,ctx) then
   ex[#ex+1]={id=x.id,label=x.label or ("Ir para "..(R.room[x.to].title or x.to)),dur=x.duration or 0,line=x._line or r._line or 0} end end
 for _,x in ipairs(r.actions or {}) do
  if not (x.hidden and not S.shown[r.id..":"..x.id]) and test(x.conditions,ctx) then ac[#ac+1]={id=x.id,label=x.label or x.id,dur=x.duration or 0,line=x._line or r._line or 0} end end
 for _,id in ipairs(R.ord.char) do local c=S.chars[id] if c and c.room==S.room then ch[#ch+1]={id=id,name=R.char[id].name or id,act=c.state.activity,line=R.char[id]._line or 0} end end
 for _,id in ipairs(R.ord.item) do local n=S.inv[id] if n and n>0 then local it=R.item[id] inv[#inv+1]={id=id,title=it.title or id,desc=it.description,n=n,use=it.use~=nil} end end
 local hud={}
 for _,hh in ipairs(R.hud or {}) do
  if not S.hudoff[hh.var] and test(hh.conditions,{}) then
   local mx=hh.max if type(mx)=="string" then mx=S.vars[mx] end
   hud[#hud+1]={key=hh.var,label=interp(hh.label or hh.var),style=hh.style or "text",value=S.vars[hh.var],max=mx,min=hh.min,color=hh.color,prefix=hh.prefix,suffix=hh.suffix,decimals=hh.decimals,icon=hh.icon,on=hh.on_label,off=hh.off_label,show_value=hh.show_value,warn=hh.warn,line=R.hudline or 0} end end
 local day,wd,h,m=calc()
 local descLine=r._line or 0
 if type(r.description)=="function" then local di=debug.getinfo(r.description,"S") descLine=di and di.linedefined or descLine end
 return {rid=S.room,roomline=r._line or 0,descline=descLine,hud=hud,title=interp(r.title or r.id),desc=interp(d or ""),exits=ex,acts=ac,chars=ch,inv=inv,day=day,wd=PT[wd+1],h=h,m=m,theme=(S.theme and next(S.theme)) and S.theme or nil}
end
local function idle() return waiting==nil and cur==nil and #Q==0 and not S.over and not S.creating end
local function endinfo(id) local e=R.ending[id] local t=e.description
 if type(t)=="function" then local ok,v=callLimited(t,{}) t=ok and v or ("[erro: "..tostring(v).."]") end

 return {id=id,title=interp(e.title or id),text=interp(t or ""),kind=e.kind or "bad",n=n,total=#R.ord.ending} end
local function reply(out) out=out or pump() local e=errs errs={}
 local ov if S.over then ov=endinfo(S.over) end
 local sv if S.savereq and idle() then local lb=S.savereq S.savereq=nil sv={label=type(lb)=="string" and lb or "",data=ser{pid=R.proj.id,ver=R.proj.version,S=S}} end
 return J{out=out,view=view(),errs=e,waiting=waiting~=nil,idle=idle(),proj=R.proj,over=ov,creation=S.creating and R.creation or nil,save=sv} end
local function find(list,id) for _,x in ipairs(list or {}) do if x.id==id then return x end end end
local function startscene(id) Q[#Q+1]={mkframe(id)} end
-- API
local y=coroutine.yield
local env={}
for _,k in ipairs{"pairs","ipairs","type","tostring","tonumber","select","pcall","error","next","assert"} do env[k]=_G[k] end
env.string,env.table=string,table
env.math=setmetatable({random=function(a,b) local r=rnd() if not a then return r end if not b then a,b=1,a end return a+math.floor(r*(b-a+1)) end},{__index=math})
env.Project={create=function(d) if type(d)~="table" or not d.id then error("Project.create exige uma tabela com id",2) end R.proj={id=d.id,title=d.title or d.id,version=d.version or "0",author=d.author,description=d.description} end}
env.Variables={define=function(t) local i=debug.getinfo(2,"l") R.varline=i and i.currentline or nil for k,v in pairs(t) do R.vars0[k]=v end end}
env.World={create=function(n,f) R.world.name=n if f then f() end end,
 start=function(r) R.world.start=r end,clock=function(c) R.world.clock=c end,intro=function(s) R.world.intro=s end,
 current=function() return {name=R.world.name,room=S.room} end,player_room=function() return S.room end,

 move=function(r) local x for _,e in ipairs(R.room[S.room].exits or {}) do if e.to==r then x=e break end end

env.Room={create=function(id,d) local i=debug.getinfo(2,"l") local line=i and i.currentline or nil

-- API do Vesper Developer: alterações visuais podem ser aplicadas em execução
-- e exportadas como um bloco Dev.apply(...) ao final do arquivo .vyr.
local function devList(list,updates,removes,kind)
 local rm,up,seen={},{},{}
 for _,id in ipairs(removes or {}) do rm[tostring(id)]=true end
 for _,x in ipairs(updates or {}) do if x.id then up[tostring(x.id)]=x end end
 local out={}
 for _,x in ipairs(list or {}) do
  local id=tostring(x.id or x.to or "") local u=up[id]
  if not rm[id] then
   if u then
    for _,k in ipairs(kind=="exit" and {"label","to","duration","scene","save","hidden"} or {"label","duration","scene","save","hidden"}) do if u[k]~=nil then x[k]=u[k] end end
    seen[id]=true
   end
   out[#out+1]=x
  end
 end
 for id,u in pairs(up) do if not seen[id] and not rm[id] then
  local x={id=id,label=u.label or id,duration=tonumber(u.duration) or 0}
  if kind=="exit" then x.to=u.to end
  if u.scene then x.scene=u.scene end
  if u.save~=nil then x.save=u.save end
  if u.hidden~=nil then x.hidden=u.hidden end
  out[#out+1]=x
 end end
 return out
end
local function devApply(p)
 p=type(p)=="table" and p or {}
 for id,x in pairs(p.rooms or {}) do
  local r=R.room[id]
  if not r then r={id=id,title=tostring(x.title or id),description=tostring(x.description or ""),exits={},actions={}} R.room[id]=r R.ord.room[#R.ord.room+1]=id end
  if r then
   if x.title~=nil then r.title=tostring(x.title) end
   if x.description~=nil then r.description=tostring(x.description) end
   if x.exits or x.removeExits then r.exits=devList(r.exits,x.exits,x.removeExits,"exit") end
   if x.actions or x.removeActions then r.actions=devList(r.actions,x.actions,x.removeActions,"action") end
  end
 end
 for id,x in pairs(p.characters or {}) do
  local d=R.char[id]
  if not d and x.create and R.room[x.initial_room or x.room] then
   d={name=tostring(x.name or id),initial_room=x.initial_room or x.room,state={activity=x.activity or ""}}
   R.char[id]=d R.ord.char[#R.ord.char+1]=id
   S.chars[id]={room=d.initial_room,state=copy(d.state)}
  end
  if d then
   if x.name~=nil then d.name=tostring(x.name) end
   if x.initial_room~=nil and R.room[x.initial_room] then d.initial_room=x.initial_room end
   if x.activity~=nil then d.state=d.state or {} d.state.activity=x.activity end
   local c=S.chars[id]
   if c then
    if x.initial_room~=nil and R.room[x.initial_room] then c.room=x.initial_room end
    if x.room~=nil and R.room[x.room] then c.room=x.room end
    if x.activity~=nil then c.state.activity=x.activity end
   end
  end
 end
 for _,k in ipairs(p.removeVariables or {}) do R.vars0[k]=nil if S.vars then S.vars[k]=nil end end
 for k,v in pairs(p.variables or {}) do R.vars0[k]=copy(v) if S.vars then S.vars[k]=copy(v) end end
 if p.hud then
  local existing={} for _,h in ipairs(R.hud or {}) do existing[h.var]=h end
  local nextHud={}
  for _,h in ipairs(p.hud) do
   local item=existing[h.var] or {var=h.var}
   for _,k in ipairs{"label","style","max","min","color","prefix","suffix","decimals","icon","on_label","off_label","show_value","warn"} do
    if h[k]~=nil then item[k]=h[k] end
   end
   nextHud[#nextHud+1]=item
  end
  R.hud=nextHud
 end
 if p.project then
  if p.project.title~=nil then R.proj.title=tostring(p.project.title) end
  if p.project.version~=nil then R.proj.version=tostring(p.project.version) end
  if p.project.author~=nil then R.proj.author=tostring(p.project.author) end
 end
 if p.world and p.world.start and R.room[p.world.start] then R.world.start=p.world.start end
 return true
end

-- Efeitos para Narrator.say / Character.say:
-- shake, wave, rainbow, glitch, neon e pulse.
-- Ex.: Narrator.say("A tela falha...", {effect="glitch", color="#ff2bd6", speed=28})
-- Ex.: Character.say("ana", "Olá.", {effect="wave"})
local TEXT_FX={shake=true,wave=true,rainbow=true,glitch=true,neon=true,pulse=true}
local sayBindings,saySeq={},0
local function captureSayBinding(sourceLine)
 local info=debug.getinfo(4,"Slf")
 saySeq=saySeq+1
 local id="say_"..saySeq
 local locals,ups={},{}
 if info then
  local i=1
  while true do local n,v=debug.getlocal(4,i);if not n then break end;if n:sub(1,1)~="(" then locals[n]=v end;i=i+1 end
  if info.func then
   i=1;while true do local n,v=debug.getupvalue(info.func,i);if not n then break end;if n~="_ENV" then ups[n]=v end;i=i+1 end
  end
 end
 local line=tonumber(sourceLine) or (info and info.currentline) or 0
 sayBindings[id]={locals=locals,upvalues=ups,line=line}
 return id,line
end
local function sayText(text,who,opts,kind,sourceLine)
 opts=type(opts)=="table" and opts or {}

local function bad(k,m,d) return {k,m,d and d._line} end
local function validate()
 local w=R.world
 if not R.proj.id then return bad("Configuração inválida","Project.create({ id, title, version }) não foi chamado.") end
 if not w.start then return bad("Configuração inválida","World.start(room_id) não foi definido.") end
 if not R.room[w.start] then return bad("Referência inexistente",'O ambiente inicial "'..tostring(w.start)..'" não existe.') end
 if w.intro and not R.scene[w.intro] then return bad("Referência inexistente",'A cena inicial "'..w.intro..'" não existe.') end
 for _,id in ipairs(R.ord.room) do local r=R.room[id]
  for _,x in ipairs(r.exits or {}) do
   if not R.room[x.to] then return bad("Referência inexistente",'A saída "'..tostring(x.id)..'" de "'..id..'" leva ao ambiente "'..tostring(x.to)..'", mas não existe nenhum ambiente com esse identificador.',r) end
   if x.scene and not R.scene[x.scene] then return bad("Referência inexistente",'A cena "'..x.scene..'" (saída "'..x.id..'") não existe.',r) end end
  for _,x in ipairs(r.actions or {}) do if x.scene and not R.scene[x.scene] then return bad("Referência inexistente",'A cena "'..x.scene..'" (ação "'..x.id..'") não existe.',r) end end end
 for _,id in ipairs(R.ord.char) do local c=R.char[id]
  if not R.room[c.initial_room] then return bad("Referência inexistente",'O personagem "'..id..'" começa no ambiente "'..tostring(c.initial_room)..'", que não existe.',c) end end
 for _,id in ipairs(R.ord.event) do local e=R.event[id]
  if e.room and not R.room[e.room] then return bad("Referência inexistente",'O evento "'..id..'" usa o ambiente "'..e.room..'", que não existe.',e) end
  if e.character and not R.char[e.character] then return bad("Referência inexistente",'O evento "'..id..'" usa o personagem "'..e.character..'", que não existe.',e) end
  if e.trigger=="time" and not hm(e.at) then return bad("Configuração inválida",'O evento "'..id..'" precisa de at = "HH:MM".',e) end
  for _,d in ipairs(e.weekdays or {}) do if not WI[d] then return bad("Configuração inválida",'Dia da semana inválido "'..tostring(d)..'" no evento "'..id..'".',e) end end end
 for _,id in ipairs(R.ord.sched) do local s=R.sched[id]
  if not R.char[s.character] then return bad("Referência inexistente",'A rotina "'..id..'" usa o personagem "'..tostring(s.character)..'", que não existe.',s) end
  if s.weekly and s.entries then return bad("Configuração inválida",'A rotina "'..id..'" mistura entries e weekly.',s) end
  local lists={} if s.entries then lists[1]=s.entries end
  for d,l in pairs(s.weekly or {}) do if not WI[d] then return bad("Configuração inválida",'Dia inválido "'..tostring(d)..'" na rotina "'..id..'".',s) end lists[#lists+1]=l end
  for _,l in ipairs(lists) do for _,e in ipairs(l) do
   if not hm(e.at) then return bad("Configuração inválida",'Entrada da rotina "'..id..'" sem at = "HH:MM".',s) end
   if e.room and not R.room[e.room] then return bad("Referência inexistente",'A rotina "'..id..'" usa o ambiente "'..e.room..'", que não existe.',s) end end end end
 for _,id in ipairs(R.ord.event) do local e=R.event[id]
  if e.game_over and not R.ending[e.game_over] then return bad("Referência inexistente",'O evento "'..id..'" usa game_over = "'..tostring(e.game_over)..'", mas não existe nenhum Ending.create com esse identificador.',e) end end
 for _,id in ipairs(R.ord.ending) do local e=R.ending[id]
  if type(e.description)~="string" and type(e.description)~="function" then return bad("Configuração inválida",'O final "'..id..'" precisa de description (texto ou função).',e) end end
 local c=R.creation
 if c then local CT={text=1,choice=1,multi=1,number=1} local seen={}
  for i,f in ipairs(c.fields) do
   if type(f)~="table" or type(f.id)~="string" or f.id=="" then return bad("Configuração inválida","Creation.define: o campo #"..i.." precisa de id (texto).",c) end
   if seen[f.id] then return bad("Configuração inválida",'Creation.define: o campo "'..f.id..'" aparece duas vezes.',c) end seen[f.id]=true
   if not CT[f.type] then return bad("Configuração inválida",'Creation.define: o campo "'..f.id..'" tem tipo inválido "'..tostring(f.type)..'" (use text, choice, multi ou number).',c) end
   if f.type=="choice" or f.type=="multi" then
    if type(f.options)~="table" or #f.options==0 then return bad("Configuração inválida",'Creation.define: o campo "'..f.id..'" precisa de options.',c) end
    for _,o in ipairs(f.options) do if type(o)~="table" or o.id==nil or not o.text then return bad("Configuração inválida",'Creation.define: toda opção de "'..f.id..'" precisa de id e text.',c) end end end
   if f.type=="number" and f.min and f.max and f.min>f.max then return bad("Configuração inválida",'Creation.define: o campo "'..f.id..'" tem min maior que max.',c) end
  end end
 if R.hud then local HS={bar=1,number=1,text=1,pips=1,flag=1} local hv={}
  for k in pairs(R.vars0) do hv[k]=true end
  if c then for _,f in ipairs(c.fields) do if f.variable then hv[f.variable]=true end end end
  local d={_line=R.hudline}
  for i,h in ipairs(R.hud) do
   if type(h.var)~="string" then return bad("Configuração inválida",'HUD.define: o item '..i..' precisa de var = "nome_da_variavel".',d) end
   if not hv[h.var] then return bad("Referência inexistente",'HUD.define: a variável "'..h.var..'" não foi definida em Variables.define.',d) end
   if h.style and not HS[h.style] then return bad("Configuração inválida",'HUD.define: estilo inválido "'..tostring(h.style)..'" em "'..h.var..'" (use bar, number, text, pips ou flag).',d) end
   if h.style=="bar" and h.max==nil then return bad("Configuração inválida",'HUD.define: a barra "'..h.var..'" precisa de max (número ou nome de uma variável).',d) end
   if type(h.max)=="string" and not hv[h.max] then return bad("Referência inexistente",'HUD.define: o max "'..h.max..'" da barra "'..h.var..'" não é uma variável definida.',d) end
  end end
end
local function finalize()
 local ev={} for i,id in ipairs(R.ord.event) do ev[i]=R.event[id] ev[i]._i=i end
 table.sort(ev,function(a,b) local pa,pb=a.priority or 0,b.priority or 0 if pa~=pb then return pa>pb end return a._i<b._i end)
 R.evlist=ev R.timed={} local o=0
 for _,e in ipairs(ev) do if e.trigger=="time" then o=o+1
  local ws if e.weekdays then ws={} for _,d in ipairs(e.weekdays) do ws[WI[d]]=true end end
  R.timed[#R.timed+1]={m=hm(e.at),cls=3,o=o,ev=e,ok=function(day,wd)
   if e.day and e.day~=day then return false end if ws and not ws[wd] then return false end
   if e.repeat_mode=="weekly" and not ws and wd~=S.wd0 then return false end return true end} end end
 for _,id in ipairs(R.ord.sched) do local s=R.sched[id]
  local function add(l,okf) for _,e in ipairs(l) do o=o+1 R.timed[#R.timed+1]={m=hm(e.at),cls=1,o=o,e=e,ch=s.character,ok=okf} end end
  if s.entries then add(s.entries,function() return true end) end
  for _,d in ipairs(DAYS) do local l=(s.weekly or {})[d] if l then add(l,function(_,wd) return wd==WI[d] end) end end end
end

local function split(s) local t={} for x in tostring(s):gmatch("[^,]+") do t[#t+1]=x end return t end
function V_cfinish()
 local c=R.creation if not c or not S.creating then return reply() end
 local ferr,vals,shown={},{},{}
 for _,f in ipairs(c.fields) do
  local raw,v,sh=CD[f.id],nil,nil
  local req=f.required~=false
  local function fail(m) ferr[f.id]=m end
  if f.type=="text" then
   raw=tostring(raw or f.default or ""):match("^%s*(.-)%s*$")
   if raw=="" then if req then fail("Preencha este campo.") end
   else local n=utf8 and utf8.len(raw) or #raw
    if n>(f.max or 40) then fail("Use no máximo "..(f.max or 40).." caracteres.")
    elseif f.min and n<f.min then fail("Use pelo menos "..f.min.." caracteres.")
    else v=raw sh=raw end end
  elseif f.type=="number" then
   local n=tonumber(raw) or tonumber(f.default) or f.min or 0
   if f.min and n<f.min then n=f.min end
   if f.max and n>f.max then n=f.max end
   v=n sh=tostring(n)
  else
   local ids={} for _,o in ipairs(f.options) do ids[tostring(o.id)]=o end
   local picked=split(raw or "")
   local okp=true for _,p in ipairs(picked) do if not ids[p] then okp=false end end
   if not okp then fail("Opção inválida.")
   elseif f.type=="choice" then
    if #picked==0 then if req then fail("Escolha uma opção.") end
    else v=picked[1] sh=ids[v].text end
   else
    local mn,mx=f.min or (req and 1 or 0),f.max
    if #picked<mn then fail("Escolha pelo menos "..mn..".")
    elseif mx and #picked>mx then fail("Escolha no máximo "..mx..".")
    else v=picked local tx={} for _,p in ipairs(picked) do tx[#tx+1]=ids[p].text end sh=table.concat(tx,", ") end
   end
  end
  if not ferr[f.id] and v~=nil and f.validate then
   local ok,m=pcall(f.validate,v)
   if not ok then errs[#errs+1]=tostring(m) elseif type(m)=="string" then fail(m) end end
  vals[f.id]=v shown[f.id]=sh
 end
 if next(ferr) then return J{ok=false,cerrs=ferr} end
 for _,f in ipairs(c.fields) do local v=vals[f.id]
  S.player[f.id]=v S.pshow[f.id]=shown[f.id]
  if v~=nil and f.variable and type(v)~="table" then setv(f.variable,v) end
  if v~=nil and (f.type=="choice" or f.type=="multi") then
   local picks=type(v)=="table" and v or {v}
   for _,p in ipairs(picks) do for _,o in ipairs(f.options) do if tostring(o.id)==p then
    for k,x in pairs(o.set or {}) do setv(k,x) end
    for k,x in pairs(o.add or {}) do setv(k,(S.vars[k] or 0)+x) end end end end end
 end
 S.creating=nil CD={}
 if c.on_complete then cb(c.on_complete,copy(S.player)) end
 startintro()
 return reply()
end

function V_devinfo()
 local rooms,chars,scenes,vars,hud={},{},{},{},{}
 local scene_lines={}
 for _,id in ipairs(R.ord.room) do local r=R.room[id] local ex,ac={},{}
  for _,x in ipairs(r.exits or {}) do ex[#ex+1]={id=x.id or x.to,to=x.to,label=x.label or x.id or x.to,duration=x.duration or 0,scene=x.scene,line=x._line or r._line or 0} end
  for _,x in ipairs(r.actions or {}) do ac[#ac+1]={id=x.id,label=x.label or x.id,duration=x.duration or 0,scene=x.scene,line=x._line or r._line or 0} end
  local desc=type(r.description)=="string" and r.description or (id==S.room and (view().desc or "") or "")
  rooms[#rooms+1]={id=id,title=r.title or id,description=desc,dynamic=type(r.description)=="function",line=r._line or 0,description_line=(type(r.description)=="function" and (debug.getinfo(r.description,"S").linedefined or r._line) or r._line) or 0,exits=ex,actions=ac}
 end
 for _,id in ipairs(R.ord.char) do local d=R.char[id] local c=S.chars[id]
  chars[#chars+1]={id=id,name=d.name or id,initial_room=d.initial_room,room=c and c.room or d.initial_room,activity=c and c.state.activity or (d.state and d.state.activity) or "",line=d._line or 0}
 end
 for _,id in ipairs(R.ord.scene) do scenes[#scenes+1]=id scene_lines[id]=R.scene[id]._line or 0 end
 local events,schedules,active_scenes={},{},{} for _,id in ipairs(R.ord.event) do events[#events+1]=id end for _,id in ipairs(R.ord.sched) do schedules[#schedules+1]=id end

 local function addSceneStack(stack,status,queue_index)
  for depth,fr in ipairs(stack or {}) do
   active_scenes[#active_scenes+1]={id=fr.id,status=status,depth=depth,current=(status=="executando" and depth==#stack),queue=queue_index}
  end
 end
 if cur then addSceneStack(cur,"executando") end
 for qi,stack in ipairs(Q) do addSceneStack(stack,"na fila",qi) end

 for _,h in ipairs(R.hud or {}) do hud[#hud+1]={var=h.var,label=h.label or h.var,style=h.style or "text",max=h.max,min=h.min,color=h.color,prefix=h.prefix,suffix=h.suffix,decimals=h.decimals,icon=h.icon,on_label=h.on_label,off_label=h.off_label,show_value=h.show_value,warn=h.warn,line=R.hudline or 0} end

function V_devapply(str)
 local f,e=load("return "..tostring(str or "{}"),"devpatch","t",{})
 if not f then return J{ok=false,msg=tostring(e)} end
 local ok,p=pcall(f) if not ok or type(p)~="table" then return J{ok=false,msg=tostring(p or "Patch inválido.")} end
 local good,err=pcall(devApply,p) if not good then return J{ok=false,msg=tostring(err)} end

end
function V_hotreload(src,name,patch)
 local f,e=load(src,"="..tostring(name or "historia.vyr"),"t",env)
 if not f then return J{ok=false,kind="Erro de sintaxe Lua",msg=tostring(e)} end
 local oldR={} for k,v in pairs(R) do oldR[k]=v end
 local liveS=S
 -- Guarda somente as cenas-raiz que estavam ativas; elas serão reiniciadas
 -- com as novas definições, sem repetir cenas-filhas separadamente.
 local restartTasks,seenTasks={},{}
 local function rememberActive(stack)
  local root=stack and stack[1]
  if not root then return end
  if root.id then
   local key="scene:"..root.id
   if not seenTasks[key] then seenTasks[key]=true;restartTasks[#restartTasks+1]={kind="scene",id=root.id} end
  elseif root.eventId and root.eventContext then
   local key="event:"..root.eventId
   if not seenTasks[key] then seenTasks[key]=true;restartTasks[#restartTasks+1]={kind="event",id=root.eventId,context=copy(root.eventContext)} end
  end
 end
 rememberActive(cur)
 for _,stack in ipairs(Q or {}) do rememberActive(stack) end
 local runtime={Q=Q,cur=cur,waiting=waiting,EQ=EQ,errs=errs,busy=busy,adv=adv,pend=pend}
 local function restoreOld()
  for k in pairs(R) do R[k]=nil end
  for k,v in pairs(oldR) do R[k]=v end
  S=liveS Q,cur,waiting,EQ,errs=runtime.Q,runtime.cur,runtime.waiting,runtime.EQ,runtime.errs
  busy,adv,pend=runtime.busy,runtime.adv,runtime.pend
 end
 -- O arquivo é executado sobre uma cópia temporária do estado. Nenhuma cena
 -- pausada é retomada nem descartada durante a compilação das novas definições.
 S=copy(liveS)
 Q,cur,waiting,EQ,errs={},nil,nil,{},{}
 busy,adv,pend=false,false,0
 for k in pairs(R) do R[k]=nil end
 local fresh={room={},scene={},char={},event={},item={},sched={},ending={},proj={},world={},vars0={},ord={room={},scene={},char={},event={},item={},sched={},ending={}}}
 for k,v in pairs(fresh) do R[k]=v end
 local ok,err=pcall(f)
 if not ok then restoreOld() return J{ok=false,kind="Erro durante a execução do arquivo",msg=tostring(err)} end
 local validation=validate()
 if validation then restoreOld() return J{ok=false,kind=validation[1],msg=validation[2],line=validation[3]} end
 local finalized,finalErr=pcall(finalize)
 if not finalized then restoreOld() return J{ok=false,kind="Erro ao reconstruir eventos",msg=tostring(finalErr)} end
 -- Mantém valores atuais; só inicializa variáveis/personagens que não existiam.
 for k,v in pairs(R.vars0) do if S.vars[k]==nil then S.vars[k]=copy(v) end end
 for _,id in ipairs(R.ord.char) do if not S.chars[id] then local c=R.char[id] S.chars[id]={room=c.initial_room,state=copy(c.state or {})} end end
 local applied,patchErr=pcall(devApply,type(patch)=="table" and patch or {})
 if not applied then restoreOld() return J{ok=false,kind="Falha ao aplicar alterações visuais",msg=tostring(patchErr)} end
 if not R.room[S.room] then S.room=R.world.start or R.ord.room[1] end
 if not S.room or not R.room[S.room] then restoreOld() return J{ok=false,msg="O projeto atualizado não possui um ambiente válido para continuar."} end
 -- Descarta o console/corrotinas anteriores e reinicia as cenas que estavam
 -- ativas desde o começo, agora usando as funções recém-carregadas.
 Q,cur,waiting,EQ,errs={},nil,nil,{},{}
 busy,adv,pend=false,false,0
 for _,task in ipairs(restartTasks) do
  if task.kind=="scene" then
   if R.scene[task.id] then startscene(task.id) end
  elseif task.kind=="event" then
   local ev=R.event[task.id]
   if ev and ev.execute then cb(ev.execute,task.context,ev.id) end
  end
 end
 return reply()
end
function V_revalueText(id,expr)
 local b=sayBindings[tostring(id)]
 if not b then return J{ok=false,msg="Vínculo da mensagem não encontrado."} end
 local scope={} for k,v in pairs(b.upvalues or {}) do scope[k]=v end
 for k,v in pairs(b.locals or {}) do scope[k]=v end
 setmetatable(scope,{__index=env})
 local f,e=load("return ("..tostring(expr)..")","=vesper-live-text","t",scope)
 if not f then return J{ok=false,msg=tostring(e)} end
 local ok,value=pcall(f)
 if not ok then return J{ok=false,msg=tostring(value)} end
 return J{ok=true,text=interp(tostring(value)),line=b.line}
end
function V_devgoto(id)
 if not R.room[id] then return J{ok=false,msg='Ambiente inexistente: '..tostring(id)} end
 S.room=id Q,cur,waiting={},nil,nil
 return reply({})
end
function V_devrefresh() return reply(waiting and {waiting} or {}) end
function V_visit(id) S.visited=S.visited or {} S.visited[id]=true return J{ok=true} end
function V_getvisited() return J(S.visited or {}) end
function V_save() if not idle() then return J("") end return J(ser{pid=R.proj.id,ver=R.proj.version,S=S}) end
function V_restore(str)
 local f=load("return "..str,"save","t",{}) local ok,d=pcall(f)
 if not ok or type(d)~="table" or type(d.S)~="table" or type(d.S.vars)~="table" or not R.room[d.S.room] then return J{ok=false,msg="Arquivo de save corrompido."} end
 if d.pid~=R.proj.id or d.ver~=R.proj.version then return J{ok=false,msg="Save de outra história ou versão ("..tostring(d.pid).." "..tostring(d.ver)..")."} end
 S=d.S S.player=S.player or {} S.pshow=S.pshow or {} S.hudoff=S.hudoff or {} S.theme=S.theme or {} S.visited=S.visited or {} S.savereq=nil
 -- Compatibilidade com saves antigos: recupera o game over se o final já foi executado.
 if not S.over then
  local oldfinal=S.vars.final
  if oldfinal and R.ending[oldfinal] then S.over=oldfinal
  else
   local deadline=((7-(S.day0 or 1))*1440)+23*60
   if (S.vars.divida or 0)>0 and (S.t or 0)>=deadline then
    S.vars.fim=true S.vars.final="cobradores" S.over="cobradores"
   end
  end
 end
 Q,cur,waiting,EQ,errs={},nil,nil,{},{} busy,adv,pend=false,false,0 return reply({})
end

async function swapRoom(v){

async function mobileHudCopy(el,h,from,to){
  if(innerWidth>760||REDUCE||from===undefined||from===to)return;
  const header=$('#game header'),rect=header.getBoundingClientRect();
  const card=document.createElement('div');card.className='hud-float';

function luaString(value){
 return '"'+String(value).replace(/[\\"\x00-\x1f\x7f]/g,ch=>{
  if(ch==='\\')return '\\\\';
  if(ch==='"')return '\\"';
  if(ch==='\n')return '\\n';
  if(ch==='\r')return '\\r';
  if(ch==='\t')return '\\t';
  return '\\'+ch.charCodeAt(0).toString().padStart(3,'0');
 })+'"';
}
function luaValue(v){
 if(v===null||v===undefined)return 'nil';
 if(typeof v==='boolean')return v?'true':'false';
 if(typeof v==='number')return Number.isFinite(v)?String(v):'0';
 if(typeof v==='string')return luaString(v);
 if(Array.isArray(v))return '{'+v.map(luaValue).join(',')+'}';
 if(typeof v==='object')return '{'+Object.entries(v).filter(([,x])=>x!==undefined).map(([k,x])=>'['+luaString(k)+']='+luaValue(x)).join(',')+'}';
 return 'nil';
}

function devOpenSourceLine(line,term='',searchLines=35){
 devOpenPanel('code');
 requestAnimationFrame(()=>{
  const ta=$('#devCodeText');if(!ta)return;
  const lines=ta.value.split('\n');
  const targetLine=Math.max(1,Math.min(lines.length,Number(line)||1));
  let found=null;
  if(term){
   const escaped=String(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   let re;
   try{re=new RegExp('(?<![\\p{L}\\p{N}_])'+escaped+'(?![\\p{L}\\p{N}_])','giu')}catch{re=new RegExp(escaped,'gi')}
   const radius=Math.max(0,Number(searchLines)||0),lo=Math.max(1,targetLine-radius),hi=Math.min(lines.length,targetLine+radius);
   for(let n=lo;n<=hi;n++){
    re.lastIndex=0;let m;
    while((m=re.exec(lines[n-1]))){
     const candidate={line:n,start:m.index,end:m.index+m[0].length,distance:Math.abs(n-targetLine)};
     if(!found||candidate.distance<found.distance||(candidate.distance===found.distance&&n<found.line))found=candidate;
     if(!m[0].length)re.lastIndex++;
    }
   }
  }
  let start=0;for(let i=0;i<targetLine-1;i++)start+=lines[i].length+1;
  const selectedLine=found?.line||targetLine;
  if(found){start=0;for(let i=0;i<selectedLine-1;i++)start+=lines[i].length+1;start+=found.start;}
  const end=found?start+(found.end-found.start):start+(lines[targetLine-1]||'').length;
  ta.focus();ta.setSelectionRange(start,end);
  const lh=parseFloat(getComputedStyle(ta).lineHeight)||19;
  ta.scrollTop=Math.max(0,((found?selectedLine:targetLine)-2)*lh);
 });
}
/* Localiza a expressão que alimentou uma fala, inclusive concatenações e chamadas dinâmicas. */
function devLuaCallExpression(src,line,kind){
 const lines=src.split('\n'),base=Math.max(0,Math.min(lines.length-1,(Number(line)||1)-1));
 const chunk=lines.slice(Math.max(0,base-3),Math.min(lines.length,base+5)).join('\n');
 const needle=kind==='Character.say'?'Character.say':'Narrator.say';
 const at=chunk.indexOf(needle);if(at<0)return null;let i=chunk.indexOf('(',at+needle.length);if(i<0)return null;
 const args=[];let start=++i,depth=0,quote='',longClose='',comment=false;
 while(i<chunk.length){const c=chunk[i],n=chunk[i+1];
  if(comment){if(c==='\n')comment=false;i++;continue}
  if(longClose){if(chunk.startsWith(longClose,i)){i+=longClose.length;longClose='';continue}i++;continue}
  if(quote){if(c==='\\'){i+=2;continue}if(c===quote)quote='';i++;continue}
  if(c==='-'&&n==='-'){comment=true;i+=2;continue}
  if(c==="'"||c==='"'){quote=c;i++;continue}
  if(c==='['){const m=chunk.slice(i).match(/^\[(=*)\[/);if(m){longClose=']'+m[1]+']';i+=m[0].length;continue}}
  if(c==='('||c==='{'||c==='['){depth++;i++;continue}
  if(c===')'&&depth===0){args.push(chunk.slice(start,i).trim());break}
  if(c===')'||c==='}'||c===']'){depth--;i++;continue}
  if(c===','&&depth===0){args.push(chunk.slice(start,i).trim());start=++i;continue}
  i++;
 }

}

function devOpenSceneCode(id){

 if(line)devOpenSourceLine(line,'Scene.create',8);
 else{devOpenPanel('code');requestAnimationFrame(()=>devFindCode('Scene.create("'+id+'"')||devFindCode(id));}
}
function devGoto(id){try{const r=call('V_devgoto',id);if(!r.view){if(r.ok===false)throw new Error(r.msg);throw new Error('Não foi possível trocar de ambiente.')}play(r);devUpdateInfo();renderDevPanel();toast('Ambiente selecionado.')}catch(e){toast(e.message)}}
async function devApplyCode(){
 if(!G)return;
 const next=$('#devCodeText').value,name=G.name;
 try{
  const r=call('V_hotreload',next,name,luaValue(DEV.patch));
  if(r.ok===false)throw new Error((r.kind?r.kind+': ':'')+(r.msg||'Falha ao aplicar o código.'));
  G={...r.proj,name,src:next};
  $('#gt').textContent=G.title||name;
  // Limpa o console: as cenas ativas foram reiniciadas pelo runtime com o código novo.
  $('#log').innerHTML='';$('#log').scrollTop=0;
  last=r;
  await render(r);
  devUpdateInfo();
  devSetMode(false);
  toast('Código aplicado. Console limpo e cenas ativas reiniciadas.');
 }catch(e){toast('Código não aplicado: '+e.message)}
}
async function devOpenFile(file){if(!file)return;try{const src=await file.text();const name=file.name;DEV.patch={rooms:{},characters:{},variables:{},hud:null,project:{},world:{}};DEV.source=src;await open(src,name,'new');}catch(e){toast('Falha ao abrir arquivo: '+e.message)}}
$('#devPlay').onclick=()=>devSetMode(false);$('#devEdit').onclick=()=>{if(!DEV.edit)devSetMode(true);else if($('#devpanel').hidden)devOpenPanel('room');else devClosePanel()};$('#devCode').onclick=()=>{devSetMode(true);devOpenPanel('code')};$('#devSave').onclick=devSaveDownload;$('#devLoad').onclick=()=>$('#devFile').click();$('#devFile').onchange=e=>devOpenFile(e.target.files[0]);$('#devHome').onclick=()=>{devSetMode(false);leave();$('#devbar').hidden=true};$('#devClose').onclick=devClosePanel;
document.querySelectorAll('[data-dev-tab]').forEach(b=>b.onclick=()=>{DEV.selected=null;devOpenPanel(b.dataset.devTab)});
$('#devInspector').addEventListener('click',e=>{
 const c=e.target.closest('[data-dev-edit-object]');if(c){devEditObject(c.dataset.devEditObject,c.dataset.id);return}
});
/* No modo de edição, qualquer elemento visível leva à sua origem no .vyr. */
document.addEventListener('click',e=>{
 if(!DEV.edit||$('#game').hidden)return;
 const action=e.target.closest('#acts button[data-dev-type]');
 if(action){e.preventDefault();e.stopImmediatePropagation();
  const line=Number(action.dataset.devLine)||devCurrentRoom()?.line||0;
  devOpenSourceLine(line,devClickedWord(e,action)||action.dataset.devId||'',120);return;
 }
 const character=e.target.closest('#chars [data-dev-character]');
 if(character){e.preventDefault();e.stopImmediatePropagation();
  devOpenSourceLine(Number(character.dataset.devLine)||1,devClickedWord(e,character),45);return;
 }
 const title=e.target.closest('#rt');
 if(title){e.preventDefault();e.stopImmediatePropagation();devOpenSourceLine(Number(title.dataset.devLine)||devCurrentRoom()?.line||1,devClickedWord(e,title),12);return;}
 const description=e.target.closest('#desc');
 if(description){e.preventDefault();e.stopImmediatePropagation();devOpenSourceLine(Number(description.dataset.devLine)||devCurrentRoom()?.description_line||1,devClickedWord(e,description),30);return;}
 const variable=e.target.closest('#hud .hv[data-dev-var]');
 if(variable){e.preventDefault();e.stopImmediatePropagation();devOpenSourceLine(Number(variable.dataset.devLine)||1,variable.dataset.devVar,16);return;}
 const lineEl=e.target.closest('#log .ln[data-dev-say]');
 if(lineEl){e.preventDefault();e.stopImmediatePropagation();
  const span=lineEl.querySelector(':scope > span');
  const sourceLine=Number(lineEl.dataset.devLine)||0;
  if(!sourceLine){toast('Não foi possível identificar a linha que gerou esta fala.');return}
  devOpenSourceLine(sourceLine,devClickedWord(e,span||lineEl),6);return;
 }
},true);
/* Após carregar qualquer história, habilita as ferramentas sem alterar a experiência de jogo. */
const devOriginalOpen=open;
open=async function(src,name,mode){DEV.source=src;DEV.patch={rooms:{},characters:{},variables:{},hud:null,project:{},world:{}};await devOriginalOpen(devSource(src,DEV.patch),name,mode);if(G){G.src=src;$('#devbar').hidden=false;devSetMode(false);devUpdateInfo();}};
// Template mínimo para iniciar um projeto sem conteúdo de demonstração.
const EMPTY_PROJECT_TEMPLATE=`Project.create({
  id = "meu_projeto",
  title = "Meu projeto",
  version = "1.0"
})

World.create("Meu mundo")

Room.create("inicio", {
  title = "Início",
  description = "Este é o começo da sua história.",
  exits = {},
  actions = {}
})

World.start("inicio")
`;
$('#loadTemplate').onclick=()=>open(EMPTY_PROJECT_TEMPLATE,'meu_projeto.vyr','new');
/* O input original aponta para open dinamicamente. O código de projeto permanece sem o bloco de patch até a exportação. */
